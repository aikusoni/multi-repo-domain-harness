<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rooms · 관찰 보드</title>
  <link rel="stylesheet" href="/board.css"><link rel="stylesheet" href="/theme.css"><script src="/theme.js"></script><script src="/board.js" defer></script>
</head>
<body>
  <header><div><p class="eyebrow">LOCAL · READ ONLY</p><h1>작업이 흐르는 곳</h1></div><details class="theme-picker"><summary>테마</summary><div class="theme-panel"><label>화면 밝기<select data-theme-mode><option value="system">시스템 설정</option><option value="light">밝게</option><option value="dark">어둡게</option></select></label><label>색상 테마<select data-theme-palette><option value="forest">숲 · Forest</option><option value="ocean">바다 · Ocean</option><option value="sand">모래 · Sand</option></select></label><small>이 브라우저에 보관하며 오너·관찰 화면에 함께 적용합니다.</small></div></details><span id="connection" role="status">연결 중</span></header>
  <p class="intro">방의 흐름만 살펴봅니다. 이름, 방 제목, 레포, 대화와 실행 출력은 이 화면에 전달되지 않습니다.</p>
  <p id="notice" role="alert" hidden></p>
  <section id="totals" aria-label="전체 작업 현황"></section>
  <div class="section-heading"><h2>작업 방</h2><button id="download" disabled>익명 현황 저장</button></div>
  <section id="rooms" aria-label="방별 상태"></section>
  <footer>각 점은 연결된 멤버 수를 나타냅니다. 상태는 서버 관리 실행 기준이며 업무 검증·배포 완료를 뜻하지 않습니다.</footer>
</body>
</html>
